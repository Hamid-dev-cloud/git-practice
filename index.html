
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Website</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>My Portfolio</h1>
        <nav>
            <a href="#about">About</a>
            <a href="#skills">Skills</a>
            <a href="#contact">Contact</a>

    </header>

    <main>
        <section id="about">
            <h2>Hello, I'm a Web Developer</h2>
            <p>I'm learning HTML, CSS, JavaScript, and Git.</p>
            <button id="welcomeBtn">Say Hello</button>
            <p id="message"></p>
        </section>

        <section id="skills">
            <h2>My Skills</h2>
            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
            </ul>
        </section>

        <section id="contact">
            <h2>Contact Me</h2>
            <p>Email: example@email.com</p>
        </section>
    </main>

    <footer>
        <p>My First Git Project</p>
    </footer>
</body>
</html>
